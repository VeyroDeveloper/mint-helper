name: Website CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-lint:
    name: Build Website & Validate Specs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run logic unit tests
        run: npx tsx --test src/tests/profile_tests.test.ts

      - name: TypeScript Lint Check
        run: npm run lint

      - name: Build Web Application & Static Assets
        run: npm run build
