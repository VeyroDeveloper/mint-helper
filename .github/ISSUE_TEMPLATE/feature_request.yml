name: Feature Request
description: Suggest an idea or enhancement for mint-helper
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please verify that your suggestion aligns with mint-helper principles: zero telemetry, user transparency, native Linux desktop standards, and zero artificial gimmicks.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of what the user friction or limitation is.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A concise explanation of how mint-helper should address this.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Any other workflows or manual tools currently used.
